<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Redoute - Lista de Produtos</title>
    <link rel="stylesheet" href="product_list.css">
</head>
<body>

    <div class="full-page-container">
        <img src="images/productList.png" alt="Lista La Redoute" class="responsive-print">

        <div class="product-card">
            <a href="product_detail.html" class="product-link">
                <div class="product-image-wrapper">
                    <img src="images/Gira_discos.png" alt="Novo Gira-discos Lenco">
                </div>
                <div class="product-info">
                    <h3 class="brand">LENCO</h3>
                    <p class="description">Gira-discos Lenco - Novo Modelo</p>
                    <div class="price-container">
                        <span class="current-price">169.99 €</span>
                        <span class="old-price">199.99 €</span>
                        <span class="discount">-15%</span>
                    </div>
                </div>
            </a>
        </div>

        <a href="product_list.html" class="hotspot-link"></a>
    </div>

</body>
</html>
